name: AgentOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python and dependencies
        run: uv sync --extra dev
      - name: Lint with Ruff
        run: uv run ruff check app tests
      - name: Run unit and golden dataset regression tests
        run: uv run pytest tests/unit tests/evals/test_adk_evals.py
