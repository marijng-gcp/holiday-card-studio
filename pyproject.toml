[project]
name = "holiday-card-studio"
version = "0.1.0"
description = "Mobile-first, multi-agent AI holiday greeting card studio built with Google ADK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "google-adk[db,eval]>=1.14.0",
    "sqlalchemy>=2.0.0",
    "google-cloud-dlp>=3.25.0",
    "google-cloud-secret-manager>=2.21.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-sdk>=1.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
